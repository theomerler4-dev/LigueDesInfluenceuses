    :root {
      --bg: #0b0b0b;
      --card: #161616;
      --pink: #ff2d78;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    body { background:var(--bg); color:white; height:100vh; overflow:hidden; }
    .header { 
      background:linear-gradient(135deg,#ff0066,#ff2d78); 
      padding:14px 16px; 
      text-align:center; 
      font-size:18px; 
      font-weight:700; 
      position:sticky; 
      top:0; 
      z-index:100;
      position: relative;
    }
    #onlineBadge {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      background: rgba(0,0,0,0.35);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .nav { display:flex; overflow-x:auto; background:#121212; border-bottom:1px solid #222; scrollbar-width:none; }
    .nav::-webkit-scrollbar { display:none; }
    .nav-btn { flex:0 0 auto; padding:13px 15px; background:none; border:none; color:#777; font-size:14px; font-weight:600; white-space:nowrap; position:relative; }
    .nav-btn.active { color:var(--pink); }
    .nav-btn.active::after { content:''; position:absolute; bottom:0; left:18%; right:18%; height:3px; background:var(--pink); border-radius:3px 3px 0 0; }
    .content { height:calc(100vh - 102px); overflow-y:auto; padding:16px 12px 110px; }
    .page { display:none; }
    .page.active { display:block; }
    .section-title { font-size:16px; font-weight:700; margin:4px 0 14px; }

    .duel-card { background:#161616; border-radius:22px; padding:16px 14px 14px; margin-bottom:16px; border:1px solid #2a2a2a; }
    .match-title { text-align:center; font-size:13px; color:#aaa; margin-bottom:6px; font-weight:500; }
    .time-left { text-align:center; font-size:13px; color:var(--pink); margin-bottom:12px; font-weight:600; }
    .time-left.expired { color:#e74c3c; }

    .duel-players { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .player { flex:1; text-align:center; display:flex; flex-direction:column; align-items:center; }
    .player-photo { width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid #333; margin-bottom:8px; background:#222; cursor:pointer; }
    .player-name { font-weight:700; font-size:15px; }
    .player-name.clickable { color: var(--pink); text-decoration: underline; cursor: pointer; }
    .player-votes { font-size:12px; color:var(--pink); margin-top:2px; }
    .vs-circle { width:46px; height:46px; background:linear-gradient(135deg,#ff0066,#ff2d78); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; }

    .vote-btns { display:flex; gap:8px; }
    .vote-btn { flex:1; padding:12px 6px; border:none; border-radius:14px; background:#252525; color:white; font-weight:600; font-size:13px; }
    .vote-btn:disabled { opacity:0.4; background:#1a1a1a; }

    .table-wrapper { overflow-x:auto; border-radius:16px; border:1px solid #2a2a2a; background:#161616; }
    table { width:100%; border-collapse:collapse; font-size:13px; min-width:340px; }
    th { background:#1f1f1f; padding:11px 6px; text-align:center; color:#bbb; }
    td { padding:11px 6px; text-align:center; border-bottom:1px solid #252525; }
    .name-cell { text-align:left!important; padding-left:12px!important; font-weight:600; }
    
    .name-cell.promo { color: #2ecc71; }
    .name-cell.promo-barrage { color: #82e0aa; }
    .name-cell.releg { color: #e74c3c; }
    .name-cell.releg-barrage { color: #f5b7b1; }
    
    .pos { color:var(--pink); font-weight:800; }
    .empty { text-align:center; color:#666; padding:40px 20px; font-size:14px; line-height:1.5; }

    .admin-buttons { position:fixed; bottom:22px; right:14px; display:none; flex-direction:column; gap:10px; z-index:200; }
    .admin-btn { width:54px; height:54px; border-radius:50%; border:none; color:white; font-size:20px; box-shadow:0 6px 18px rgba(0,0,0,0.4); }
    .btn-match { background:#2ecc71; }
    .btn-reset { background:#e67e22; font-size:18px; }

    .global-btn {
      position: fixed;
      bottom: 22px;
      left: 14px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg,#ff0066,#ff2d78);
      color: white;
      font-size: 22px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:300; align-items:flex-end; justify-content:center; }
    .modal.show { display:flex; }
    .modal-content { background:#1a1a1a; width:100%; max-width:420px; border-radius:24px 24px 0 0; padding:24px 20px 40px; max-height:85vh; overflow-y:auto; }
    .modal-title { font-size:18px; font-weight:700; margin-bottom:18px; text-align:center; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:13px; color:#aaa; margin-bottom:6px; }
    .form-group select, .form-group input { width:100%; padding:13px 14px; border-radius:14px; border:1px solid #333; background:#252525; color:white; font-size:15px; }
    .modal-actions { display:flex; gap:10px; margin-top:10px; }
    .btn { flex:1; padding:14px; border:none; border-radius:14px; font-weight:600; font-size:15px; }
    .btn-cancel { background:#333; color:white; }
    .btn-confirm { background:linear-gradient(135deg,#ff0066,#ff2d78); color:white; }

    .match-list-item { background:#252525; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:14px; }
    .match-list-item button { background:#e74c3c; border:none; color:white; padding:6px 10px; border-radius:8px; font-size:12px; }

    .gallery-main { width:100%; max-height:320px; object-fit:cover; border-radius:18px; margin-bottom:16px; background:#222; }
    .gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .gallery-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; background:#222; }
    .gallery-empty { text-align:center; color:#777; padding:20px; font-size:14px; }

    .profile-header { text-align:center; margin-bottom:20px; }
    .profile-photo { width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid var(--pink); margin-bottom:10px; background:#222; }
    .profile-stats { display:flex; justify-content:center; gap:14px; margin:12px 0 20px; font-size:13px; flex-wrap:wrap; }
    .profile-stats span { background:#252525; padding:6px 12px; border-radius:20px; }
    .history-item { background:#252525; border-radius:14px; padding:12px 14px; margin-bottom:10px; font-size:13px; }
    .history-item .match-name { font-weight:600; margin-bottom:4px; }
    .history-item .result { font-size:12px; color:#aaa; }
    .result.win { color:#2ecc71; }
    .result.lose { color:#e74c3c; }
    .result.draw { color:#f1c40f; }
    .result.pending { color:var(--pink); }
  </style>
</head>

  <!-- Modal Match -->
  <div class="modal" id="matchModal">
    <div class="modal-content">
      <div class="modal-title"> Créer un match</div>
      <div class="form-group">
        <label>Ligue</label>
        <select id="matchLeague" onchange="updateMatchSelects()">
          <option value="0">Ligue 1</option><option value="1">Ligue 2</option><option value="2">Ligue 3</option>
          <option value="3">Ligue 4</option><option value="4">Ligue 5</option><option value="5">Ligue Ascension</option>
        </select>
      </div>
      <div class="form-group"><label>Titre du match</label><input type="text" id="matchTitle" placeholder="Ex: Saison 1 - Journée 1"></div>
      <div class="form-group"><label>Participante 1</label><select id="matchP1"></select></div>
      <div class="form-group"><label>Participante 2</label><select id="matchP2"></select></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModals()">Fermer</button>
        <button class="btn btn-confirm" onclick="ajouterMatch()">Ajouter le match</button>
      </div>
      <div style="margin-top:20px;">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Matchs actuels :</div>
        <div id="currentMatchesList"></div>
      </div>
    </div>
  </div>

  <!-- Modal Galerie -->
  <div class="modal" id="galleryModal">
    <div class="modal-content">
      <div class="modal-title" id="galleryTitle">Photos</div>

      <div id="galleryGrid" class="gallery-grid"></div>
      <div id="galleryEmpty" class="gallery-empty" style="display:none;">Aucune photo supplémentaire</div>
      <div class="modal-actions" style="margin-top:20px;">
        <button class="btn btn-cancel" onclick="closeModals()" style="flex:1;">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Modal Classement Général All-Time -->
  <div class="modal" id="generalRankingModal">
    <div class="modal-content">
      <div class="modal-title">Classement Général All-Time</div>
      <div style="font-size:12px;color:#aaa;text-align:center;margin-bottom:16px;">Depuis la Saison 1 • Toutes ligues confondues</div>
      <div id="generalRankingContent"></div>
      <div class="modal-actions" style="margin-top:20px;">
        <button class="btn btn-cancel" onclick="closeModals()" style="flex:1;">Fermer</button>
      </div>
    </div>
  </div>

    let data = JSON.parse(localStorage.getItem('ligueDataV7')) || defaultData;

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#ff0066');
    tg.setBackgroundColor('#0b0b0b');

    setTimeout(() => {
      const user = tg.initDataUnsafe?.user;
      if (user && Number(user.id) === ADMIN_ID) {

    // ========== FIREBASE ==========
    function saveToFirebase() {
      if (!db) return;
      db.ref('ligueData').set(data);
    }

    function listenFirebase() {
      if (!db) return;
      db.ref('ligueData').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          data = val;
          render();
        }
      });
    }

    if (USE_FIREBASE && db) {
      listenFirebase();
    }

    function save() {
      localStorage.setItem('ligueDataV7', JSON.stringify(data));
      localStorage.setItem('votesFaitsV7', JSON.stringify(votesFaits));
      saveToFirebase();
    }

    function resetCache() {
      if (!confirm(" Es-tu sûr de vouloir TOUT effacer ?\n(participantes, matchs, votes)\nCette action est irréversible.")) return;
      
      localStorage.removeItem('ligueDataV7');
      localStorage.removeItem('votesFaitsV7');
      if (db) db.ref('ligueData').remove();
      
      tg.showPopup({ title: "Cache réinitialisé", message: "L'application va se recharger", buttons: [{type:"ok"}] });
      setTimeout(() => location.reload(), 800);
    }

    function updateOnlineCount() {
      const count = Math.floor(Math.random() * 21) + 8;
      document.getElementById('onlineBadge').textContent = ` ${count}`;
    }
    updateOnlineCount();
    setInterval(updateOnlineCount, 12000);

    function getPhoto(p) {
      return (p.photo && p.photo.startsWith('http')) ? p.photo : `https://ui-avatars.com/api/?name=${encodeURIComponent(p.nom)}&background=333&color=fff&size=400`;
    }

    function getTimeLeft(createdAt) {
      const remaining = (createdAt + DUREE_MATCH) - Date.now();
      if (remaining <= 0) return { text: "Match terminé", expired: true };
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      return { text: `Il reste ${h}h ${m}min`, expired: false };
    }

    function processFinishedMatches() {
      let changed = false;
      data.ligues.forEach(ligue => {
        (ligue.matchs || []).forEach(match => {
          if (match.finished) return;
          if (Date.now() < match.createdAt + DUREE_MATCH) return;
          const p1 = ligue.participantes.find(p => p.nom === match.p1);
          const p2 = ligue.participantes.find(p => p.nom === match.p2);
          if (!p1 || !p2) return;
          const v1 = match.votesP1 || 0;
          const v2 = match.votesP2 || 0;
          if (v1 > v2) { p1.v += 1; p1.total += 3; p2.d += 1; }
          else if (v2 > v1) { p2.v += 1; p2.total += 3; p1.d += 1; }
          else { p1.n += 1; p1.total += 1; p2.n += 1; p2.total += 1; }
          match.finished = true;
          changed = true;
        });
      });
      if (changed) save();
    }

    function openMatchModal() { updateMatchSelects(); document.getElementById('matchModal').classList.add('show'); }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); }

    function openGallery(lIndex, nom) {
      const player = data.ligues[lIndex].participantes.find(p => p.nom === nom);
      if (!player) return;
      document.getElementById('galleryTitle').textContent = ` ${player.nom}`;
      document.getElementById('galleryMainPhoto').src = getPhoto(player);
      const grid = document.getElementById('galleryGrid');
      const empty = document.getElementById('galleryEmpty');
      grid.innerHTML = '';
      const gallery = player.gallery || [];
      if (gallery.length === 0) {
        empty.style.display = 'block';
        grid.style.display = 'none';
      } else {
        empty.style.display = 'none';
        grid.style.display = 'grid';
        gallery.forEach(url => {
          if (url && url.startsWith('http')) {
            grid.innerHTML += `<img src="${url}" alt="${player.nom}" loading="lazy">`;
          }
        });
      }
      document.getElementById('galleryModal').classList.add('show');
    }

    function openPlayerProfile(lIndex, nom) {
      const ligue = data.ligues[lIndex];
      const player = ligue.participantes.find(p => p.nom === nom);
      if (!player) return;

      document.getElementById('profilePhoto').src = getPhoto(player);
      document.getElementById('profileName').textContent = player.nom;
      document.getElementById('profileLeague').textContent = ligue.nom;
      document.getElementById('profileStats').innerHTML = `
        <span>V ${player.v}</span>
        <span>N ${player.n}</span>
        <span>D ${player.d}</span>
        <span>Votes ${player.votes}</span>
        <span>Pts ${player.total}</span>
      `;

      const herMatches = (ligue.matchs || [])
        .filter(m => m.p1 === nom || m.p2 === nom)
        .sort((a, b) => b.createdAt - a.createdAt);

      const calendarEl = document.getElementById('profileCalendar');
      const historyEl = document.getElementById('profileHistory');

      if (herMatches.length === 0) {
        calendarEl.innerHTML = `<div class="empty" style="padding:20px;">Aucun match pour le moment</div>`;
        historyEl.innerHTML = `<div class="empty" style="padding:20px;">Aucune histoire de saison</div>`;
      } else {
        let calHtml = '';
        herMatches.forEach(m => {
          const time = getTimeLeft(m.createdAt);
          const opponent = m.p1 === nom ? m.p2 : m.p1;
          const isP1 = m.p1 === nom;
          let resultText = '';
          let resultClass = 'pending';

          if (time.expired || m.finished) {
            const v1 = m.votesP1 || 0;
            const v2 = m.votesP2 || 0;
            if (v1 > v2) {
              resultText = isP1 ? `Victoire ${v1}-${v2}` : `Défaite ${v2}-${v1}`;
              resultClass = isP1 ? 'win' : 'lose';
            } else if (v2 > v1) {
              resultText = isP1 ? `Défaite ${v1}-${v2}` : `Victoire ${v2}-${v1}`;
              resultClass = isP1 ? 'lose' : 'win';
            } else {
              resultText = `Nul ${v1}-${v2}`;
              resultClass = 'draw';
            }
          } else {
            resultText = time.text;
            resultClass = 'pending';
          }

          calHtml += `
            <div class="history-item">
              <div class="match-name">${m.title || 'Match'} • vs ${opponent}</div>
              <div class="result ${resultClass}">${resultText}</div>
            </div>`;
        });
        calendarEl.innerHTML = calHtml;

        let histHtml = '';
        herMatches.forEach(m => {
          const time = getTimeLeft(m.createdAt);
          const opponent = m.p1 === nom ? m.p2 : m.p1;
          const isP1 = m.p1 === nom;
          const date = new Date(m.createdAt).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });

          let resultText = 'En cours';
          let resultClass = 'pending';

          if (time.expired || m.finished) {
            const v1 = m.votesP1 || 0;
            const v2 = m.votesP2 || 0;
            if (v1 > v2) {
              resultText = isP1 ? `Victoire (${v1} - ${v2})` : `Défaite (${v1} - ${v2})`;
              resultClass = isP1 ? 'win' : 'lose';
            } else if (v2 > v1) {
              resultText = isP1 ? `Défaite (${v1} - ${v2})` : `Victoire (${v2} - ${v1})`;
              resultClass = isP1 ? 'lose' : 'win';
            } else {
              resultText = `Nul (${v1} - ${v2})`;
              resultClass = 'draw';
            }
          }

          histHtml += `
            <div class="history-item">
              <div class="match-name">${m.title || 'Match'}</div>
              <div style="font-size:12px;color:#888;margin:2px 0;">${date} • vs ${opponent}</div>
              <div class="result ${resultClass}">${resultText}</div>
            </div>`;
        });
        historyEl.innerHTML = histHtml;
      }

      document.getElementById('profileModal').classList.add('show');
    }

    function openGeneralRanking() {
      processFinishedMatches();
      const allPlayers = [];
      data.ligues.forEach((ligue, li) => {
        ligue.participantes.forEach(p => {
          allPlayers.push({
            ...p,
            ligueNom: ligue.nom,
            ligueIndex: li
          });
        });
      });
      allPlayers.sort((a, b) => b.total - a.total || b.votes - a.votes);

      let html = '';
      if (allPlayers.length === 0) {
        html = `<div class="empty">Aucune participante</div>`;
      } else {
        html = `<div class="table-wrapper"><table>
          <thead><tr>
            <th>#</th>
            <th style="text-align:left;padding-left:12px">Joueuse</th>
            <th>Ligue</th>
            <th>V</th><th>N</th><th>D</th>
            <th>Votes</th><th>Total</th>
          </tr></thead><tbody>`;

        allPlayers.forEach((p, i) => {
          const pos = i + 1;
          let medal = pos === 1 ? "" : pos === 2 ? "" : pos === 3 ? "" : pos;
          html += `<tr>
            <td class="pos">${medal}</td>
            <td class="name-cell">${p.nom}</td>
            <td style="font-size:11px;color:#aaa;">${p.ligueNom.replace('Ligue ','L')}</td>
            <td>${p.v}</td><td>${p.n}</td><td>${p.d}</td>
            <td>${p.votes}</td><td><b>${p.total}</b></td>
          </tr>`;
        });
        html += `</tbody></table></div>`;
      }

      document.getElementById('generalRankingContent').innerHTML = html;
      document.getElementById('generalRankingModal').classList.add('show');
    }

    function updateMatchSelects() {
      const lIndex = +document.getElementById('matchLeague').value;
      const parts = data.ligues[lIndex].participantes;
      const p1 = document.getElementById('matchP1');
      const p2 = document.getElementById('matchP2');
      p1.innerHTML = p2.innerHTML = '';
      parts.forEach(p => {
        p1.innerHTML += `<option value="${p.nom}">${p.nom}</option>`;
        p2.innerHTML += `<option value="${p.nom}">${p.nom}</option>`;
      });
      const list = document.getElementById('currentMatchesList');
      list.innerHTML = '';
      (data.ligues[lIndex].matchs || []).forEach((m, i) => {
        const time = getTimeLeft(m.createdAt);
        list.innerHTML += `
          <div class="match-list-item">
            <div>
              <div style="font-weight:600">${m.title || 'Sans titre'}</div>
              <div>${m.p1} vs ${m.p2}</div>
              <div style="font-size:12px;color:${time.expired?'#e74c3c':'#aaa'}">${time.text}</div>
            </div>
            <button onclick="supprimerMatch(${lIndex},${i})">Suppr</button>
          </div>`;
      });
    }

    function ajouterMatch() {
      const lIndex = +document.getElementById('matchLeague').value;
      const title = document.getElementById('matchTitle').value.trim() || "Match";
      const p1 = document.getElementById('matchP1').value;
      const p2 = document.getElementById('matchP2').value;
      if (!p1 || !p2) return tg.showAlert("Choisis deux participantes");
      if (p1 === p2) return tg.showAlert("Choisis deux participantes différentes");
      if (!data.ligues[lIndex].matchs) data.ligues[lIndex].matchs = [];
      data.ligues[lIndex].matchs.push({
        title, p1, p2, createdAt: Date.now(), votesP1: 0, votesP2: 0, finished: false
      });
      save(); updateMatchSelects(); render();
      tg.showPopup({ title:"Match créé ", message:`${title}\n${p1} vs ${p2}`, buttons:[{type:"ok"}] });
    }

    function supprimerMatch(lIndex, mIndex) {
      data.ligues[lIndex].matchs.splice(mIndex, 1);
      save(); updateMatchSelects(); render();
    }

    function render() {
      processFinishedMatches();
      const content = document.getElementById('content');
      content.innerHTML = '';

      data.ligues.forEach((ligue, index) => {
        const page = document.createElement('div');
        page.className = `page ${index === 0 ? 'active' : ''}`;
        page.id = `page-${index}`;

        let html = `<div class="section-title">${ligue.emoji} Matchs</div>`;

        if (!ligue.matchs || !ligue.matchs.length) {
          html += `<div class="empty">Aucun match.<br>Appuie sur  pour en créer</div>`;
        } else {
          ligue.matchs.forEach(match => {
            const p1 = ligue.participantes.find(p => p.nom === match.p1);
            const p2 = ligue.participantes.find(p => p.nom === match.p2);
            if (!p1 || !p2) return;

            const matchId = `${index}-${match.p1}-${match.p2}-${match.createdAt}`;
            const time = getTimeLeft(match.createdAt);
            const deja = votesFaits[matchId];
            const canVote = !time.expired && !deja;
            const showVotes = deja || time.expired;
            const votesP1Display = showVotes ? `${match.votesP1 || 0} votes` : '? votes';
            const votesP2Display = showVotes ? `${match.votesP2 || 0} votes` : '? votes';

            html += `
              <div class="duel-card">
                <div class="match-title">${match.title || 'Match'}</div>
                <div class="time-left ${time.expired ? 'expired' : ''}">${time.text}</div>
                <div class="duel-players">
                  <div class="player">
                    <img class="player-photo" src="${getPhoto(p1)}" onclick="openGallery(${index}, '${p1.nom}')" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p1.nom)}&background=333&color=fff&size=200'">
                    <div class="player-name clickable" onclick="openPlayerProfile(${index}, '${p1.nom}')">${p1.nom}</div>
                    <div class="player-votes">${votesP1Display}</div>
                  </div>
                  <div class="vs-circle">VS</div>
                  <div class="player">
                    <img class="player-photo" src="${getPhoto(p2)}" onclick="openGallery(${index}, '${p2.nom}')" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p2.nom)}&background=333&color=fff&size=200'">
                    <div class="player-name clickable" onclick="openPlayerProfile(${index}, '${p2.nom}')">${p2.nom}</div>
                    <div class="player-votes">${votesP2Display}</div>
                  </div>
                </div>
                <div class="vote-btns">
                  <button class="vote-btn" ${!canVote?'disabled':''} onclick="voter(${index},'${p1.nom}','${matchId}',${match.createdAt})"> ${p1.nom}</button>
                  <button class="vote-btn" ${!canVote?'disabled':''} onclick="voter(${index},'${p2.nom}','${matchId}',${match.createdAt})"> ${p2.nom}</button>
                </div>
              </div>`;
          });
        }

        // Classement
        html += `<div class="section-title" style="margin-top:26px"> Classement</div>`;
        if (!ligue.participantes.length) {
          html += `<div class="empty">Aucune participante</div>`;
        } else {
          const sorted = [...ligue.participantes].sort((a,b) => b.total - a.total || b.votes - a.votes);
          const total = sorted.length;

          html += `<div class="table-wrapper"><table><thead><tr>
            <th>#</th><th style="text-align:left;padding-left:12px">Joueuse</th>
            <th>V</th><th>N</th><th>D</th><th>Votes</th><th>Total</th>
          </tr></thead><tbody>`;

          sorted.forEach((p, i) => {
            const pos = i + 1;
            let medal = pos === 1 ? "" : pos === 2 ? "" : pos === 3 ? "" : pos;
            let nameClass = "name-cell";
            let extra = "";

            if (([1,2,3,4].includes(index) && pos <= 3) || (index === 5 && pos <= 5)) {
              nameClass += " promo"; extra = " ";
            } else if (([1,2,3].includes(index) && pos === 4) || (index === 4 && pos === 4) || (index === 5 && pos === 6)) {
              nameClass += " promo-barrage"; extra = " ";
            }

            if (([0,1,2,3].includes(index) && pos > total - 3) || (index === 4 && pos > total - 5)) {
              nameClass += " releg"; extra = " ";
            } else if (([0,1,2,3].includes(index) && pos === 17) || (index === 4 && pos === 15)) {
              nameClass += " releg-barrage"; extra = " ";
            }

            html += `<tr>
              <td class="pos">${medal}</td>
              <td class="${nameClass}">${p.nom}${extra}</td>
              <td>${p.v}</td><td>${p.n}</td><td>${p.d}</td>
              <td>${p.votes}</td><td><b>${p.total}</b></td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }

        page.innerHTML = html;
        content.appendChild(page);
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`page-${btn.dataset.league}`).classList.add('active');
        };
      });
    }

    function voter(lIndex, nom, matchId, createdAt) {
      const time = getTimeLeft(createdAt);
      if (time.expired) return tg.showAlert("Ce match est terminé");
      if (votesFaits[matchId]) return tg.showAlert("Tu as déjà voté");

      const ligue = data.ligues[lIndex];
      const match = ligue.matchs.find(m => m.createdAt === createdAt);
      const player = ligue.participantes.find(p => p.nom === nom);

      if (match.p1 === nom) match.votesP1 = (match.votesP1 || 0) + 1;
      else match.votesP2 = (match.votesP2 || 0) + 1;

      player.votes += 1;
      votesFaits[matchId] = true;
      save();
      render();
      tg.showPopup({ title:"Vote enregistré ", message:`Tu as voté pour ${nom}`, buttons:[{type:"ok"}] });
    }

    setInterval(render, 30000);
    render();
  </script>

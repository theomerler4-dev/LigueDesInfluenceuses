<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ligue des Influenceuses</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161616;
      --pink: #ff2d78;
      --text: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #ff0066, #ff2d78);
      padding: 14px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      display: flex;
      overflow-x: auto;
      background: #121212;
      border-bottom: 1px solid #222;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav-btn {
      flex: 0 0 auto;
      padding: 13px 15px;
      background: none;
      border: none;
      color: #777;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      position: relative;
    }
    .nav-btn.active { color: var(--pink); }
    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 18%;
      right: 18%;
      height: 3px;
      background: var(--pink);
      border-radius: 3px 3px 0 0;
    }

    .content {
      height: calc(100vh - 102px);
      overflow-y: auto;
      padding: 16px 12px 110px;
    }

    .page { display: none; }
    .page.active { display: block; }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 4px 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* DUEL */
    .duel-card {
      background: #161616;
      border-radius: 22px;
      padding: 18px 14px 14px;
      margin-bottom: 16px;
      border: 1px solid #2a2a2a;
    }

    .duel-players {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .player {
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-photo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #333;
      margin-bottom: 8px;
      background: #222;
    }

    .player-name { font-weight: 700; font-size: 15px; }
    .player-votes { font-size: 12px; color: var(--pink); margin-top: 2px; }

    .vs-circle {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #ff0066, #ff2d78);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      color: white;
    }

    .vote-btns { display: flex; gap: 8px; }
    .vote-btn {
      flex: 1;
      padding: 12px 6px;
      border: none;
      border-radius: 14px;
      background: #252525;
      color: white;
      font-weight: 600;
      font-size: 13px;
    }
    .vote-btn:disabled { opacity: 0.4; }

    /* CLASSEMENT */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #2a2a2a;
      background: #161616;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 340px;
    }
    th {
      background: #1f1f1f;
      padding: 11px 6px;
      text-align: center;
      color: #bbb;
    }
    td {
      padding: 11px 6px;
      text-align: center;
      border-bottom: 1px solid #252525;
    }
    .name-cell {
      text-align: left !important;
      padding-left: 12px !important;
      font-weight: 600;
    }
    .pos { color: var(--pink); font-weight: 800; }

    .empty {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* BOUTONS ADMIN */
    .admin-buttons {
      position: fixed;
      bottom: 24px;
      right: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 200;
    }
    .admin-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    .btn-add { background: linear-gradient(135deg, #ff0066, #ff2d78); }
    .btn-match { background: #2ecc71; font-size: 20px; }
    .btn-del { background: #333; font-size: 18px; }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
    }
    .modal.show { display: flex; }

    .modal-content {
      background: #1a1a1a;
      width: 100%;
      max-width: 420px;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 40px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
      text-align: center;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .form-group select,
    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid #333;
      background: #252525;
      color: white;
      font-size: 15px;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
    }
    .btn-cancel { background: #333; color: white; }
    .btn-confirm { background: linear-gradient(135deg, #ff0066, #ff2d78); color: white; }
  </style>
</head>
<body>

  <div class="header">👑 Ligue des Influenceuses</div>

  <div class="nav">
    <button class="nav-btn active" data-league="0">Ligue 1</button>
    <button class="nav-btn" data-league="1">Ligue 2</button>
    <button class="nav-btn" data-league="2">Ligue 3</button>
    <button class="nav-btn" data-league="3">Ligue 4</button>
    <button class="nav-btn" data-league="4">Ligue 5</button>
    <button class="nav-btn" data-league="5">Ascension</button>
  </div>

  <div class="content" id="content"></div>

  <!-- Boutons Admin -->
  <div class="admin-buttons" id="adminButtons">
    <button class="admin-btn btn-match" onclick="creerMatchs()" title="Créer les matchs">⚔️</button>
    <button class="admin-btn btn-add" onclick="openAddModal()">+</button>
    <button class="admin-btn btn-del" onclick="openDeleteModal()">🗑️</button>
  </div>

  <!-- Modal Ajouter -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-title">➕ Ajouter une participante</div>
      <div class="form-group">
        <label>Ligue</label>
        <select id="selectLeague">
          <option value="0">Ligue 1</option>
          <option value="1">Ligue 2</option>
          <option value="2">Ligue 3</option>
          <option value="3">Ligue 4</option>
          <option value="4">Ligue 5</option>
          <option value="5">Ligue Ascension</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="inputName" placeholder="Ex: Léa" maxlength="20">
      </div>
      <div class="form-group">
        <label>Photo (lien direct de l'image)</label>
        <input type="url" id="inputPhoto" placeholder="https://i.imgur.com/xxxxx.jpg">
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModals()">Annuler</button>
        <button class="btn btn-confirm" onclick="ajouter()">Ajouter</button>
      </div>
    </div>
  </div>

  <!-- Modal Supprimer -->
  <div class="modal" id="deleteModal">
    <div class="modal-content">
      <div class="modal-title">🗑️ Supprimer une participante</div>
      <div class="form-group">
        <label>Choisir la participante</label>
        <select id="selectDelete"></select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModals()">Annuler</button>
        <button class="btn" style="background:#e74c3c;color:white" onclick="supprimer()">Supprimer</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_ID = 8994516214;

    const defaultData = {
      ligues: [
        { nom: "Ligue 1", emoji: "🏆", participantes: [], matchs: [] },
        { nom: "Ligue 2", emoji: "🥈", participantes: [], matchs: [] },
        { nom: "Ligue 3", emoji: "🥉", participantes: [], matchs: [] },
        { nom: "Ligue 4", emoji: "⭐", participantes: [], matchs: [] },
        { nom: "Ligue 5", emoji: "🌟", participantes: [], matchs: [] },
        { nom: "Ligue Ascension", emoji: "🚀", participantes: [], matchs: [] }
      ]
    };

    let data = JSON.parse(localStorage.getItem('ligueDataV2')) || defaultData;
    let votesFaits = JSON.parse(localStorage.getItem('votesFaitsV2')) || {};

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#ff0066');
    tg.setBackgroundColor('#0b0b0b');

    // Admin
    setTimeout(() => {
      const user = tg.initDataUnsafe?.user;
      if (user && Number(user.id) === ADMIN_ID) {
        document.getElementById('adminButtons').style.display = 'flex';
      }
    }, 400);

    function save() {
      localStorage.setItem('ligueDataV2', JSON.stringify(data));
      localStorage.setItem('votesFaitsV2', JSON.stringify(votesFaits));
    }

    function getPhoto(p) {
      if (p.photo && p.photo.startsWith('http')) return p.photo;
      return "https://ui-avatars.com/api/?name=" + encodeURIComponent(p.nom) + "&background=333&color=fff&size=200";
    }

    function openAddModal() {
      document.getElementById('addModal').classList.add('show');
    }

    function openDeleteModal() {
      const select = document.getElementById('selectDelete');
      select.innerHTML = '';
      data.ligues.forEach((ligue, lIndex) => {
        ligue.participantes.forEach((p, pIndex) => {
          const opt = document.createElement('option');
          opt.value = `${lIndex}|${pIndex}`;
          opt.textContent = `${p.nom} (${ligue.nom})`;
          select.appendChild(opt);
        });
      });
      if (select.options.length === 0) {
        tg.showAlert("Aucune participante à supprimer");
        return;
      }
      document.getElementById('deleteModal').classList.add('show');
    }

    function closeModals() {
      document.getElementById('addModal').classList.remove('show');
      document.getElementById('deleteModal').classList.remove('show');
    }

    function ajouter() {
      const lIndex = parseInt(document.getElementById('selectLeague').value);
      const nom = document.getElementById('inputName').value.trim();
      const photo = document.getElementById('inputPhoto').value.trim();

      if (!nom) return tg.showAlert("Le nom est obligatoire");

      data.ligues[lIndex].participantes.push({
        nom, photo, v: 0, n: 0, d: 0, votes: 0, total: 0
      });
      save();
      closeModals();
      render();
      tg.showPopup({ title: "Ajoutée ✅", message: `${nom} a été ajoutée`, buttons: [{type:"ok"}] });
    }

    function supprimer() {
      const val = document.getElementById('selectDelete').value;
      if (!val) return;
      const [lIndex, pIndex] = val.split('|').map(Number);
      const nom = data.ligues[lIndex].participantes[pIndex].nom;
      data.ligues[lIndex].participantes.splice(pIndex, 1);
      // On vide aussi les matchs de cette ligue
      data.ligues[lIndex].matchs = [];
      save();
      closeModals();
      render();
      tg.showPopup({ title: "Supprimée", message: `${nom} a été supprimée`, buttons: [{type:"ok"}] });
    }

    // ========== CRÉER LES MATCHS DU JOUR ==========
    function creerMatchs() {
      tg.showPopup({
        title: "Créer les matchs ?",
        message: "Cela va générer de nouveaux matchs pour toutes les ligues (les anciens seront effacés).",
        buttons: [
          { id: "cancel", type: "cancel" },
          { id: "ok", type: "ok", text: "Créer" }
        ]
      }, (btn) => {
        if (btn !== "ok") return;

        data.ligues.forEach(ligue => {
          const participants = [...ligue.participantes];
          // Mélanger
          for (let i = participants.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [participants[i], participants[j]] = [participants[j], participants[i]];
          }

          const matchs = [];
          for (let i = 0; i < participants.length - 1; i += 2) {
            matchs.push({
              p1: participants[i].nom,
              p2: participants[i + 1].nom
            });
          }
          ligue.matchs = matchs;
        });

        // Reset des votes du jour
        votesFaits = {};
        save();
        render();
        tg.showPopup({ title: "Matchs créés ⚔️", message: "Les matchs du jour ont été générés !", buttons: [{type:"ok"}] });
      });
    }

    function render() {
      const content = document.getElementById('content');
      content.innerHTML = '';

      data.ligues.forEach((ligue, index) => {
        const page = document.createElement('div');
        page.className = `page ${index === 0 ? 'active' : ''}`;
        page.id = `page-${index}`;

        let html = `<div class="section-title">${ligue.emoji} Matchs du jour</div>`;

        if (!ligue.matchs || ligue.matchs.length === 0) {
          html += `<div class="empty">Aucun match pour le moment.<br>Appuie sur ⚔️ pour en créer</div>`;
        } else {
          ligue.matchs.forEach(match => {
            const p1 = ligue.participantes.find(p => p.nom === match.p1);
            const p2 = ligue.participantes.find(p => p.nom === match.p2);
            if (!p1 || !p2) return;

            const matchId = `${index}-${p1.nom}-${p2.nom}`;
            const deja = votesFaits[matchId];

            html += `
              <div class="duel-card">
                <div class="duel-players">
                  <div class="player">
                    <img class="player-photo" src="${getPhoto(p1)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p1.nom)}&background=333&color=fff&size=200'">
                    <div class="player-name">${p1.nom}</div>
                    <div class="player-votes">${p1.votes} votes</div>
                  </div>
                  <div class="vs-circle">VS</div>
                  <div class="player">
                    <img class="player-photo" src="${getPhoto(p2)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p2.nom)}&background=333&color=fff&size=200'">
                    <div class="player-name">${p2.nom}</div>
                    <div class="player-votes">${p2.votes} votes</div>
                  </div>
                </div>
                <div class="vote-btns">
                  <button class="vote-btn" ${deja ? 'disabled' : ''} onclick="voter(${index}, '${p1.nom}', '${matchId}')">❤️ ${p1.nom}</button>
                  <button class="vote-btn" ${deja ? 'disabled' : ''} onclick="voter(${index}, '${p2.nom}', '${matchId}')">❤️ ${p2.nom}</button>
                </div>
              </div>`;
          });
        }

        // CLASSEMENT
        html += `<div class="section-title" style="margin-top:26px">📊 Classement</div>`;

        if (ligue.participantes.length === 0) {
          html += `<div class="empty">Aucune participante</div>`;
        } else {
          const sorted = [...ligue.participantes].sort((a,b) => b.total - a.total || b.votes - a.votes);
          html += `<div class="table-wrapper"><table><thead><tr>
            <th>#</th><th style="text-align:left;padding-left:12px">Joueuse</th>
            <th>V</th><th>N</th><th>D</th><th>Votes</th><th>Total</th>
          </tr></thead><tbody>`;

          sorted.forEach((p, i) => {
            const medal = i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : (i+1);
            html += `<tr>
              <td class="pos">${medal}</td>
              <td class="name-cell">${p.nom}</td>
              <td>${p.v}</td><td>${p.n}</td><td>${p.d}</td>
              <td>${p.votes}</td><td><b>${p.total}</b></td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }

        page.innerHTML = html;
        content.appendChild(page);
      });

      // Navigation
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`page-${btn.dataset.league}`).classList.add('active');
        };
      });
    }

    function voter(lIndex, nom, matchId) {
      if (votesFaits[matchId]) return;

      const ligue = data.ligues[lIndex];
      const player = ligue.participantes.find(p => p.nom === nom);
      const match = ligue.matchs.find(m => m.p1 === nom || m.p2 === nom);
      const opponentNom = match.p1 === nom ? match.p2 : match.p1;
      const opponent = ligue.participantes.find(p => p.nom === opponentNom);

      player.votes++;
      player.v++;
      player.total += 3;
      opponent.d++;

      votesFaits[matchId] = true;
      save();
      render();

      tg.showPopup({
        title: "Vote enregistré ❤️",
        message: `Tu as voté pour ${player.nom}`,
        buttons: [{type:"ok"}]
      });
    }

    render();
  </script>
</body>
</html>

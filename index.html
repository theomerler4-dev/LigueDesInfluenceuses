<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ligue des Influenceuses</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --tg-theme-bg-color: #0f0f0f;
      --tg-theme-text-color: #ffffff;
      --tg-theme-button-color: #ff3399;
      --tg-theme-button-text-color: #ffffff;
      --tg-theme-secondary-bg-color: #1c1c1c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--tg-theme-bg-color, #0f0f0f);
      color: var(--tg-theme-text-color, #ffffff);
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #ff0066, #ff3399);
      padding: 16px 20px 14px;
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-ligues {
      display: flex;
      overflow-x: auto;
      background: var(--tg-theme-secondary-bg-color, #1a1a1a);
      border-bottom: 1px solid #333;
      scrollbar-width: none;
    }
    .nav-ligues::-webkit-scrollbar { display: none; }

    .nav-btn {
      flex: 0 0 auto;
      padding: 14px 20px;
      background: none;
      border: none;
      color: #999;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
    }
    .nav-btn.active {
      color: #ff3399;
    }
    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 18%;
      right: 18%;
      height: 3px;
      background: #ff3399;
      border-radius: 3px 3px 0 0;
    }

    .content {
      height: calc(100vh - 108px);
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .page { display: none; }
    .page.active { display: block; }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin: 8px 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .match-card {
      background: var(--tg-theme-secondary-bg-color, #1c1c1c);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #2a2a2a;
    }

    .match-vs {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .player {
      flex: 1;
      text-align: center;
    }
    .player-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 3px;
    }
    .player-votes {
      font-size: 13px;
      color: #ff3399;
    }

    .vs {
      font-weight: 800;
      color: #555;
      font-size: 13px;
      padding: 0 8px;
    }

    .vote-btns {
      display: flex;
      gap: 10px;
    }
    .vote-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: #2a2a2a;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .vote-btn:active {
      background: #ff3399;
      transform: scale(0.97);
    }

    .ranking-item {
      display: flex;
      align-items: center;
      background: var(--tg-theme-secondary-bg-color, #1c1c1c);
      border-radius: 14px;
      padding: 13px 16px;
      margin-bottom: 9px;
      border: 1px solid #2a2a2a;
    }
    .rank {
      width: 30px;
      font-weight: 700;
      font-size: 15px;
      color: #ff3399;
    }
    .rank-name {
      flex: 1;
      font-weight: 600;
    }
    .rank-points {
      font-size: 13px;
      color: #999;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="header">Ligue des Influenceuses</div>

  <div class="nav-ligues" id="nav">
    <button class="nav-btn active" data-league="0">Diamant</button>
    <button class="nav-btn" data-league="1">Platine</button>
    <button class="nav-btn" data-league="2">Or</button>
    <button class="nav-btn" data-league="3">Argent</button>
    <button class="nav-btn" data-league="4">Bronze</button>
  </div>

  <div class="content" id="content"></div>

  <script>
    // ================================================
    //   AJOUTE TES PARTICIPANTES ICI
    // ================================================
    const ligues = [
      {
        nom: "Diamant",
        participantes: [
          // Exemple :
          // { nom: "Léa", points: 120 },
          // { nom: "Inès", points: 105 },
        ]
      },
      {
        nom: "Platine",
        participantes: []
      },
      {
        nom: "Or",
        participantes: []
      },
      {
        nom: "Argent",
        participantes: []
      },
      {
        nom: "Bronze",
        participantes: []
      }
    ];

    // Initialisation Telegram
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Plein écran
    tg.setHeaderColor('#ff0066');
    tg.setBackgroundColor('#0f0f0f');

    // Génération des pages
    const content = document.getElementById('content');

    ligues.forEach((ligue, index) => {
      const page = document.createElement('div');
      page.className = `page ${index === 0 ? 'active' : ''}`;
      page.id = `page-${index}`;

      // ----- MATCHS -----
      let html = `<div class="section-title">⚔️ Matchs du jour</div>`;

      if (ligue.participantes.length < 2) {
        html += `<div class="empty">Ajoute au moins 2 participantes<br>pour générer des matchs</div>`;
      } else {
        for (let i = 0; i < ligue.participantes.length - 1; i += 2) {
          const p1 = ligue.participantes[i];
          const p2 = ligue.participantes[i + 1];
          html += `
            <div class="match-card">
              <div class="match-vs">
                <div class="player">
                  <div class="player-name">${p1.nom}</div>
                  <div class="player-votes">0 votes</div>
                </div>
                <div class="vs">VS</div>
                <div class="player">
                  <div class="player-name">${p2.nom}</div>
                  <div class="player-votes">0 votes</div>
                </div>
              </div>
              <div class="vote-btns">
                <button class="vote-btn" onclick="voter('${p1.nom}')">${p1.nom}</button>
                <button class="vote-btn" onclick="voter('${p2.nom}')">${p2.nom}</button>
              </div>
            </div>
          `;
        }
      }

      // ----- CLASSEMENT -----
      html += `<div class="section-title" style="margin-top:28px">🏆 Classement</div>`;

      if (ligue.participantes.length === 0) {
        html += `<div class="empty">Aucune participante</div>`;
      } else {
        const sorted = [...ligue.participantes].sort((a, b) => b.points - a.points);
        sorted.forEach((p, i) => {
          html += `
            <div class="ranking-item">
              <div class="rank">${i + 1}</div>
              <div class="rank-name">${p.nom}</div>
              <div class="rank-points">${p.points} pts</div>
            </div>
          `;
        });
      }

      page.innerHTML = html;
      content.appendChild(page);
    });

    // Navigation entre les ligues
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`page-${btn.dataset.league}`).classList.add('active');
      });
    });

    function voter(nom) {
      tg.showPopup({
        title: "Vote enregistré",
        message: `Tu as voté pour ${nom} !`,
        buttons: [{ type: "ok" }]
      });
      // Plus tard on pourra envoyer le vote au bot
    }
  </script>
</body>
</html>

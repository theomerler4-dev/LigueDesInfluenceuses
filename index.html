<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ligue des Influenceuses</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161616;
      --pink: #ff2d78;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: white;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #ff0066, #ff2d78);
      padding: 14px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav {
      display: flex;
      overflow-x: auto;
      background: #121212;
      border-bottom: 1px solid #222;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      flex: 0 0 auto;
      padding: 13px 15px;
      background: none;
      border: none;
      color: #777;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      position: relative;
    }
    .nav-btn.active { color: var(--pink); }
    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 18%; right: 18%;
      height: 3px;
      background: var(--pink);
      border-radius: 3px 3px 0 0;
    }
    .content {
      height: calc(100vh - 102px);
      overflow-y: auto;
      padding: 16px 12px 110px;
    }
    .page { display: none; }
    .page.active { display: block; }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 4px 0 14px;
    }
    .duel-card {
      background: #161616;
      border-radius: 22px;
      padding: 18px 14px 14px;
      margin-bottom: 16px;
      border: 1px solid #2a2a2a;
    }
    .duel-players {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .player {
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .player-photo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #333;
      margin-bottom: 8px;
      background: #222;
    }
    .player-name { font-weight: 700; font-size: 15px; }
    .player-votes { font-size: 12px; color: var(--pink); margin-top: 2px; }
    .vs-circle {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #ff0066, #ff2d78);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
    }
    .vote-btns { display: flex; gap: 8px; }
    .vote-btn {
      flex: 1;
      padding: 12px 6px;
      border: none;
      border-radius: 14px;
      background: #252525;
      color: white;
      font-weight: 600;
      font-size: 13px;
    }
    .vote-btn:disabled { opacity: 0.4; }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #2a2a2a;
      background: #161616;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 340px;
    }
    th {
      background: #1f1f1f;
      padding: 11px 6px;
      text-align: center;
      color: #bbb;
    }
    td {
      padding: 11px 6px;
      text-align: center;
      border-bottom: 1px solid #252525;
    }
    .name-cell {
      text-align: left !important;
      padding-left: 12px !important;
      font-weight: 600;
    }
    .pos { color: var(--pink); font-weight: 800; }
    .empty {
      text-align: center;
      color: #666;
      padding: 40px 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .admin-buttons {
      position: fixed;
      bottom: 22px;
      right: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
    }
    .admin-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 22px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .btn-add { background: linear-gradient(135deg, #ff0066, #ff2d78); }
    .btn-match { background: #2ecc71; font-size: 20px; }
    .btn-del { background: #333; font-size: 18px; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #1a1a1a;
      width: 100%;
      max-width: 420px;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 40px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
      text-align: center;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .form-group select,
    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid #333;
      background: #252525;
      color: white;
      font-size: 15px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
    }
    .btn-cancel { background: #333; color: white; }
    .btn-confirm { background: linear-gradient(135deg, #ff0066, #ff2d78); color: white; }

    .match-list-item {
      background: #252525;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .match-list-item button {
      background: #e74c3c;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="header">👑 Ligue des Influenceuses</div>

  <div class="nav">
    <button class="nav-btn active" data-league="0">Ligue 1</button>
    <button class="nav-btn" data-league="1">Ligue 2</button>
    <button class="nav-btn" data-league="2">Ligue 3</button>
    <button class="nav-btn" data-league="3">Ligue 4</button>
    <button class="nav-btn" data-league="4">Ligue 5</button>
    <button class="nav-btn" data-league="5">Ascension</button>
  </div>

  <div class="content" id="content"></div>

  <div class="admin-buttons" id="adminButtons">
    <button class="admin-btn btn-match" onclick="openMatchModal()">⚔️</button>
    <button class="admin-btn btn-add" onclick="openAddModal()">+</button>
    <button class="admin-btn btn-del" onclick="openDeleteModal()">🗑️</button>
  </div>

  <!-- Modal Ajouter Participante -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-title">➕ Ajouter une participante</div>
      <div class="form-group">
        <label>Ligue</label>
        <select id="selectLeague">
          <option value="0">Ligue 1</option>
          <option value="1">Ligue 2</option>
          <option value="2">Ligue 3</option>
          <option value="3">Ligue 4</option>
          <option value="4">Ligue 5</option>
          <option value="5">Ligue Ascension</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="inputName" placeholder="Ex: Léa" maxlength="20">
      </div>
      <div class="form-group">
        <label>Photo (lien direct)</label>
        <input type="url" id="inputPhoto" placeholder="https://i.postimg.cc/xxxxx.jpg">
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModals()">Annuler</button>
        <button class="btn btn-confirm" onclick="ajouter()">Ajouter</button>
      </div>
    </div>
  </div>

  <!-- Modal Supprimer Participante -->
  <div class="modal" id="deleteModal">
    <div class="modal-content">
      <div class="modal-title">🗑️ Supprimer une participante</div>
      <div class="form-group">
        <label>Choisir</label>
        <select id="selectDelete"></select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModals()">Annuler</button>
        <button class="btn" style="background:#e74c3c;color:white" onclick="supprimer()">Supprimer</button>
      </div>
    </div>
  </div>

  <!-- Modal Créer Matchs -->
  <div class="modal" id="matchModal">
    <div class="modal-content">
      <div class="modal-title">⚔️ Créer un match</div>

      <div class="form-group">
        <label>Ligue</label>
        <select id="matchLeague" onchange="updateMatchSelects()">
          <option value="0">Ligue 1</option>
          <option value="1">Ligue 2</option>
          <option value="2">Ligue 3</option>
          <option value="3">Ligue 4</option>
          <option value="4">Ligue 5</option>
          <option value="5">Ligue Ascension</option>
        </select>
      </div>

      <div class="form-group">
        <label>Participante 1</label>
        <select id="matchP1"></select>
      </div>

      <div class="form-group">
        <label>Participante 2</label>
        <select id="matchP2"></select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModals()">Fermer</button>
        <button class="btn btn-confirm" onclick="ajouterMatch()">Ajouter le match</button>
      </div>

      <div style="margin-top:20px;">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Matchs actuels de la ligue :</div>
        <div id="currentMatchesList"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_ID = 8994516214;

    const defaultData = {
      ligues: [
        { nom: "Ligue 1", emoji: "🏆", participantes: [], matchs: [] },
        { nom: "Ligue 2", emoji: "🥈", participantes: [], matchs: [] },
        { nom: "Ligue 3", emoji: "🥉", participantes: [], matchs: [] },
        { nom: "Ligue 4", emoji: "⭐", participantes: [], matchs: [] },
        { nom: "Ligue 5", emoji: "🌟", participantes: [], matchs: [] },
        { nom: "Ligue Ascension", emoji: "🚀", participantes: [], matchs: [] }
      ]
    };

    let data = JSON.parse(localStorage.getItem('ligueDataV3')) || defaultData;
    let votesFaits = JSON.parse(localStorage.getItem('votesFaitsV3')) || {};

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#ff0066');
    tg.setBackgroundColor('#0b0b0b');

    setTimeout(() => {
      const user = tg.initDataUnsafe?.user;
      if (user && Number(user.id) === ADMIN_ID) {
        document.getElementById('adminButtons').style.display = 'flex';
      }
    }, 400);

    function save() {
      localStorage.setItem('ligueDataV3', JSON.stringify(data));
      localStorage.setItem('votesFaitsV3', JSON.stringify(votesFaits));
    }

    function getPhoto(p) {
      if (p.photo && p.photo.startsWith('http')) return p.photo;
      return "https://ui-avatars.com/api/?name=" + encodeURIComponent(p.nom) + "&background=333&color=fff&size=200";
    }

    function openAddModal() {
      document.getElementById('addModal').classList.add('show');
    }

    function openDeleteModal() {
      const select = document.getElementById('selectDelete');
      select.innerHTML = '';
      data.ligues.forEach((ligue, lIndex) => {
        ligue.participantes.forEach((p, pIndex) => {
          const opt = document.createElement('option');
          opt.value = `${lIndex}|${pIndex}`;
          opt.textContent = `${p.nom} (${ligue.nom})`;
          select.appendChild(opt);
        });
      });
      if (select.options.length === 0) return tg.showAlert("Aucune participante");
      document.getElementById('deleteModal').classList.add('show');
    }

    function openMatchModal() {
      updateMatchSelects();
      document.getElementById('matchModal').classList.add('show');
    }

    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
    }

    function updateMatchSelects() {
      const lIndex = parseInt(document.getElementById('matchLeague').value);
      const participants = data.ligues[lIndex].participantes;

      const p1 = document.getElementById('matchP1');
      const p2 = document.getElementById('matchP2');
      p1.innerHTML = '';
      p2.innerHTML = '';

      participants.forEach(p => {
        p1.innerHTML += `<option value="${p.nom}">${p.nom}</option>`;
        p2.innerHTML += `<option value="${p.nom}">${p.nom}</option>`;
      });

      // Afficher les matchs actuels
      const list = document.getElementById('currentMatchesList');
      list.innerHTML = '';
      const matchs = data.ligues[lIndex].matchs || [];
      if (matchs.length === 0) {
        list.innerHTML = '<div style="color:#666;font-size:13px;">Aucun match pour le moment</div>';
      } else {
        matchs.forEach((m, i) => {
          list.innerHTML += `
            <div class="match-list-item">
              <span>${m.p1} vs ${m.p2}</span>
              <button onclick="supprimerMatch(${lIndex}, ${i})">Suppr</button>
            </div>`;
        });
      }
    }

    function ajouterMatch() {
      const lIndex = parseInt(document.getElementById('matchLeague').value);
      const p1 = document.getElementById('matchP1').value;
      const p2 = document.getElementById('matchP2').value;

      if (!p1 || !p2) return tg.showAlert("Choisis deux participantes");
      if (p1 === p2) return tg.showAlert("Choisis deux participantes différentes");

      if (!data.ligues[lIndex].matchs) data.ligues[lIndex].matchs = [];
      data.ligues[lIndex].matchs.push({ p1, p2 });
      save();
      updateMatchSelects();
      render();
      tg.showPopup({ title: "Match ajouté ⚔️", message: `${p1} vs ${p2}`, buttons: [{type:"ok"}] });
    }

    function supprimerMatch(lIndex, mIndex) {
      data.ligues[lIndex].matchs.splice(mIndex, 1);
      save();
      updateMatchSelects();
      render();
    }

    function ajouter() {
      const lIndex = parseInt(document.getElementById('selectLeague').value);
      const nom = document.getElementById('inputName').value.trim();
      const photo = document.getElementById('inputPhoto').value.trim();
      if (!nom) return tg.showAlert("Le nom est obligatoire");

      data.ligues[lIndex].participantes.push({
        nom, photo, v: 0, n: 0, d: 0, votes: 0, total: 0
      });
      save();
      closeModals();
      render();
      tg.showPopup({ title: "Ajoutée ✅", message: `${nom} a été ajoutée`, buttons: [{type:"ok"}] });
    }

    function supprimer() {
      const val = document.getElementById('selectDelete').value;
      if (!val) return;
      const [lIndex, pIndex] = val.split('|').map(Number);
      const nom = data.ligues[lIndex].participantes[pIndex].nom;
      data.ligues[lIndex].participantes.splice(pIndex, 1);
      data.ligues[lIndex].matchs = (data.ligues[lIndex].matchs || []).filter(m => m.p1 !== nom && m.p2 !== nom);
      save();
      closeModals();
      render();
      tg.showPopup({ title: "Supprimée", message: `${nom} a été supprimée`, buttons: [{type:"ok"}] });
    }

    function render() {
      const content = document.getElementById('content');
      content.innerHTML = '';

      data.ligues.forEach((ligue, index) => {
        const page = document.createElement('div');
        page.className = `page ${index === 0 ? 'active' : ''}`;
        page.id = `page-${index}`;

        let html = `<div class="section-title">${ligue.emoji} Matchs du jour</div>`;

        if (!ligue.matchs || ligue.matchs.length === 0) {
          html += `<div class="empty">Aucun match.<br>Appuie sur ⚔️ pour en créer</div>`;
        } else {
          ligue.matchs.forEach(match => {
            const p1 = ligue.participantes.find(p => p.nom === match.p1);
            const p2 = ligue.participantes.find(p => p.nom === match.p2);
            if (!p1 || !p2) return;

            const matchId = `${index}-${p1.nom}-${p2.nom}`;
            const deja = votesFaits[matchId];

            html += `
              <div class="duel-card">
                <div class="duel-players">
                  <div class="player">
                    <img class="player-photo" src="${getPhoto(p1)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p1.nom)}&background=333&color=fff&size=200'">
                    <div class="player-name">${p1.nom}</div>
                    <div class="player-votes">${p1.votes} votes</div>
                  </div>
                  <div class="vs-circle">VS</div>
                  <div class="player">
                    <img class="player-photo" src="${getPhoto(p2)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p2.nom)}&background=333&color=fff&size=200'">
                    <div class="player-name">${p2.nom}</div>
                    <div class="player-votes">${p2.votes} votes</div>
                  </div>
                </div>
                <div class="vote-btns">
                  <button class="vote-btn" ${deja ? 'disabled' : ''} onclick="voter(${index}, '${p1.nom}', '${matchId}')">❤️ ${p1.nom}</button>
                  <button class="vote-btn" ${deja ? 'disabled' : ''} onclick="voter(${index}, '${p2.nom}', '${matchId}')">❤️ ${p2.nom}</button>
                </div>
              </div>`;
          });
        }

        html += `<div class="section-title" style="margin-top:26px">📊 Classement</div>`;
        if (ligue.participantes.length === 0) {
          html += `<div class="empty">Aucune participante</div>`;
        } else {
          const sorted = [...ligue.participantes].sort((a,b) => b.total - a.total || b.votes - a.votes);
          html += `<div class="table-wrapper"><table><thead><tr>
            <th>#</th><th style="text-align:left;padding-left:12px">Joueuse</th>
            <th>V</th><th>N</th><th>D</th><th>Votes</th><th>Total</th>
          </tr></thead><tbody>`;
          sorted.forEach((p, i) => {
            const medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1);
            html += `<tr>
              <td class="pos">${medal}</td>
              <td class="name-cell">${p.nom}</td>
              <td>${p.v}</td><td>${p.n}</td><td>${p.d}</td>
              <td>${p.votes}</td><td><b>${p.total}</b></td>
            </tr>`;
          });
          html += `</tbody></table></div>`;
        }

        page.innerHTML = html;
        content.appendChild(page);
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`page-${btn.dataset.league}`).classList.add('active');
        };
      });
    }

    function voter(lIndex, nom, matchId) {
      if (votesFaits[matchId]) return;
      const ligue = data.ligues[lIndex];
      const player = ligue.participantes.find(p => p.nom === nom);
      const match = ligue.matchs.find(m => m.p1 === nom || m.p2 === nom);
      const opponentNom = match.p1 === nom ? match.p2 : match.p1;
      const opponent = ligue.participantes.find(p => p.nom === opponentNom);

      player.votes++;
      player.v++;
      player.total += 3;
      opponent.d++;

      votesFaits[matchId] = true;
      save();
      render();
      tg.showPopup({ title: "Vote enregistré ❤️", message: `Tu as voté pour ${nom}`, buttons: [{type:"ok"}] });
    }

    render();
  </script>
</body>
</html>

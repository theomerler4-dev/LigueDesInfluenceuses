<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ligue des Influenceuses</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #1a1a1a;
      --pink: #ff2d78;
      --text: #ffffff;
      --muted: #999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #ff0066, #ff2d78);
      padding: 14px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(255, 45, 120, 0.25);
    }

    .nav {
      display: flex;
      overflow-x: auto;
      background: #141414;
      border-bottom: 1px solid #252525;
      scrollbar-width: none;
      padding: 0 4px;
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav-btn {
      flex: 0 0 auto;
      padding: 13px 15px;
      background: none;
      border: none;
      color: #777;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      position: relative;
    }
    .nav-btn.active { color: var(--pink); }
    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 18%;
      right: 18%;
      height: 3px;
      background: var(--pink);
      border-radius: 3px 3px 0 0;
    }

    .content {
      height: calc(100vh - 102px);
      overflow-y: auto;
      padding: 14px 12px 40px;
      -webkit-overflow-scrolling: touch;
    }

    .page { display: none; animation: fadeIn 0.25s ease; }
    .page.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 4px 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== MATCHS ===== */
    .match-card {
      background: var(--card);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #2a2a2a;
    }

    .match-vs {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }

    .player {
      flex: 1;
      text-align: center;
    }
    .player-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 2px;
    }
    .player-votes {
      font-size: 12px;
      color: var(--pink);
    }

    .vs {
      font-weight: 800;
      color: #555;
      font-size: 12px;
      background: #252525;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vote-btns {
      display: flex;
      gap: 8px;
    }
    .vote-btn {
      flex: 1;
      padding: 11px 6px;
      border: none;
      border-radius: 13px;
      background: #252525;
      color: white;
      font-weight: 600;
      font-size: 13px;
    }
    .vote-btn:active {
      background: var(--pink);
      transform: scale(0.96);
    }
    .vote-btn:disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    /* ===== CLASSEMENT TABLE ===== */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #2a2a2a;
      background: var(--card);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 340px;
    }

    th {
      background: #222;
      padding: 11px 6px;
      text-align: center;
      font-weight: 600;
      color: #ccc;
      border-bottom: 1px solid #333;
      white-space: nowrap;
    }

    td {
      padding: 11px 6px;
      text-align: center;
      border-bottom: 1px solid #252525;
    }

    tr:last-child td { border-bottom: none; }

    .name-cell {
      text-align: left !important;
      font-weight: 600;
      padding-left: 12px !important;
      white-space: nowrap;
    }

    .pos {
      font-weight: 800;
      color: var(--pink);
      width: 32px;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 50px 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .empty-emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="header">👑 Ligue des Influenceuses</div>

  <div class="nav">
    <button class="nav-btn active" data-league="0">Ligue 1</button>
    <button class="nav-btn" data-league="1">Ligue 2</button>
    <button class="nav-btn" data-league="2">Ligue 3</button>
    <button class="nav-btn" data-league="3">Ligue 4</button>
    <button class="nav-btn" data-league="4">Ligue 5</button>
    <button class="nav-btn" data-league="5">Ascension</button>
  </div>

  <div class="content" id="content"></div>

  <script>
    // ================================================
    //   AJOUTE TES PARTICIPANTES ICI
    //   Format : { nom: "Prénom", v:0, n:0, d:0, votes:0, total:0 }
    // ================================================
    const defaultData = [
      {
        nom: "Ligue 1",
        emoji: "🏆",
        participantes: [
          // Exemple :
          // { nom: "Léa", v: 0, n: 0, d: 0, votes: 0, total: 0 },
          // { nom: "Inès", v: 0, n: 0, d: 0, votes: 0, total: 0 },
        ]
      },
      { nom: "Ligue 2", emoji: "🥈", participantes: [] },
      { nom: "Ligue 3", emoji: "🥉", participantes: [] },
      { nom: "Ligue 4", emoji: "⭐", participantes: [] },
      { nom: "Ligue 5", emoji: "🌟", participantes: [] },
      { nom: "Ligue Ascension", emoji: "🚀", participantes: [] }
    ];

    // Charger les données sauvegardées
    let ligues = JSON.parse(localStorage.getItem('ligueData')) || defaultData;
    let votesFaits = JSON.parse(localStorage.getItem('votesFaits')) || {};

    // Telegram
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#ff0066');
    tg.setBackgroundColor('#0d0d0d');

    function saveData() {
      localStorage.setItem('ligueData', JSON.stringify(ligues));
      localStorage.setItem('votesFaits', JSON.stringify(votesFaits));
    }

    function render() {
      const content = document.getElementById('content');
      content.innerHTML = '';

      ligues.forEach((ligue, index) => {
        const page = document.createElement('div');
        page.className = `page ${index === 0 ? 'active' : ''}`;
        page.id = `page-${index}`;

        // ----- MATCHS -----
        let html = `<div class="section-title">${ligue.emoji} Matchs du jour</div>`;

        if (ligue.participantes.length < 2) {
          html += `
            <div class="empty">
              <div class="empty-emoji">😴</div>
              Ajoute au moins 2 participantes<br>pour générer des matchs
            </div>`;
        } else {
          // Génération simple des duels (1vs2, 3vs4...)
          for (let i = 0; i < ligue.participantes.length - 1; i += 2) {
            const p1 = ligue.participantes[i];
            const p2 = ligue.participantes[i + 1];
            const matchId = `${index}-${p1.nom}-${p2.nom}`;
            const dejaVote = votesFaits[matchId];

            html += `
              <div class="match-card">
                <div class="match-vs">
                  <div class="player">
                    <div class="player-name">${p1.nom}</div>
                    <div class="player-votes">${p1.votes} votes</div>
                  </div>
                  <div class="vs">VS</div>
                  <div class="player">
                    <div class="player-name">${p2.nom}</div>
                    <div class="player-votes">${p2.votes} votes</div>
                  </div>
                </div>
                <div class="vote-btns">
                  <button class="vote-btn" 
                    ${dejaVote ? 'disabled' : ''} 
                    onclick="voter(${index}, ${i}, '${matchId}')">
                    ❤️ ${p1.nom}
                  </button>
                  <button class="vote-btn" 
                    ${dejaVote ? 'disabled' : ''} 
                    onclick="voter(${index}, ${i+1}, '${matchId}')">
                    ❤️ ${p2.nom}
                  </button>
                </div>
              </div>
            `;
          }
        }

        // ----- CLASSEMENT -----
        html += `<div class="section-title" style="margin-top:26px">📊 Classement</div>`;

        if (ligue.participantes.length === 0) {
          html += `
            <div class="empty">
              <div class="empty-emoji">👤</div>
              Aucune participante
            </div>`;
        } else {
          const sorted = [...ligue.participantes].sort((a, b) => b.total - a.total || b.votes - a.votes);

          html += `
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th style="text-align:left;padding-left:12px">Joueuse</th>
                    <th>V</th>
                    <th>N</th>
                    <th>D</th>
                    <th>Votes</th>
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody>
          `;

          sorted.forEach((p, i) => {
            const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
            html += `
              <tr>
                <td class="pos">${medal}</td>
                <td class="name-cell">${p.nom}</td>
                <td>${p.v}</td>
                <td>${p.n}</td>
                <td>${p.d}</td>
                <td>${p.votes}</td>
                <td><b>${p.total}</b></td>
              </tr>
            `;
          });

          html += `</tbody></table></div>`;
        }

        page.innerHTML = html;
        content.appendChild(page);
      });

      // Rebind navigation
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`page-${btn.dataset.league}`).classList.add('active');
        };
      });
    }

    function voter(leagueIndex, playerIndex, matchId) {
      if (votesFaits[matchId]) return;

      const player = ligues[leagueIndex].participantes[playerIndex];
      const opponentIndex = playerIndex % 2 === 0 ? playerIndex + 1 : playerIndex - 1;
      const opponent = ligues[leagueIndex].participantes[opponentIndex];

      // Mise à jour stats
      player.votes += 1;
      player.v += 1;
      player.total += 3;          // 3 points pour une victoire

      opponent.d += 1;
      // opponent.total reste pareil (ou -1 si tu veux)

      votesFaits[matchId] = true;
      saveData();
      render();

      tg.showPopup({
        title: "Vote enregistré ❤️",
        message: `Tu as voté pour ${player.nom} !\n+3 points`,
        buttons: [{ type: "ok" }]
      });
    }

    // Premier rendu
    render();
  </script>
</body>
</html>
